name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  parser-and-leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the data spine
        run: |
          python scripts/download.py
          python -m ballpark.ingest
          python -m ballpark.state
      - name: Parser reconciliation + leakage tests
        run: python -m pytest tests/test_ingest.py tests/test_state.py -q
